<style>
:root{--dark:#244a35;--green:#248456;--mint:#e3f8e9;--cream:#fffdf5;--coral:#f58269;--yellow:#ffd86e;--purple:#7c64c5;--shadow:0 15px 40px #29583c18}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--dark);background:radial-gradient(circle at 15% 12%,#fff0ab 0,transparent 25%),radial-gradient(circle at 90% 30%,#c9f5da 0,transparent 30%),linear-gradient(155deg,#effff3,#fffdf0);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #e4a82c;outline-offset:4px}.wrap{max-width:890px;margin:auto;padding:20px 18px 55px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 20px}.brand{font-weight:900;font-size:clamp(18px,3vw,25px)}.pill{background:white;padding:11px 15px;border-radius:40px;box-shadow:var(--shadow);font-weight:800;white-space:nowrap}.hero,.card{border:2px solid #fff;background:#ffffffd9;box-shadow:var(--shadow);border-radius:32px;padding:clamp(22px,5vw,42px)}.hero{text-align:center;position:relative;overflow:hidden}.hero:before{content:'🌼';position:absolute;left:24px;top:25px;font-size:55px;opacity:.45}.hero:after{content:'🦋';position:absolute;right:28px;bottom:20px;font-size:50px;opacity:.6}.mascot{font-size:100px;line-height:1.2;filter:drop-shadow(0 8px 4px #487d4220)}h1{font-size:clamp(31px,6vw,49px);margin:10px 0;color:#207344}h2{font-size:clamp(23px,4.5vw,32px);line-height:1.45}.lead{font-size:19px;line-height:1.8;color:#557362}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#35ac70,#218455);border:0;color:white;font-weight:900;padding:16px 29px;border-radius:18px;font-size:19px;box-shadow:0 7px 0 #176139;transition:.15s;min-height:56px}.btn:hover{filter:brightness(1.04);transform:translateY(-2px)}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #176139}.secondary{background:#fff;color:#24734a;box-shadow:0 5px 0 #c9e8d5;border:2px solid #bfe8cd}.hidden{display:none!important}.mini{font-size:14px;color:#71897d}.stats{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.progress{height:18px;background:#e3efdf;border-radius:30px;overflow:hidden;margin:10px 0 22px;border:2px solid white}.bar{height:100%;width:0%;background:linear-gradient(90deg,#70c98e,#24a269);border-radius:30px;transition:width .4s}.tag{display:inline-block;background:#e3f8e9;color:#207044;font-weight:900;border-radius:15px;padding:9px 14px;margin-bottom:10px}.question{line-height:1.65;margin:14px 0 20px}.options{display:grid;grid-template-columns:1fr;gap:12px}.choice{display:flex;align-items:center;text-align:left;border:2px solid #dcebe0;background:#fff;min-height:65px;border-radius:20px;padding:13px 16px;font-size:19px;color:#2d5940;font-weight:750;transition:.12s}.choice:hover:not(:disabled){border-color:#5bbd87;background:#f4fff7}.choice:disabled{cursor:default}.symbol{background:#eef8f0;color:#317d53;display:inline-grid;place-items:center;width:39px;height:39px;min-width:39px;border-radius:13px;margin-right:14px;font-weight:900}.choice.good{background:#dcf8e4;border-color:#27ad68}.choice.bad{background:#ffebe7;border-color:#f58d76}.choice.good .symbol{background:#36a96b;color:white}.choice.bad .symbol{background:#e77660;color:white}.feedback{border-radius:19px;padding:17px 20px;margin-top:20px;line-height:1.75;font-size:17px}.feedback.correct{background:#e0f7e6;border:2px solid #8ad8a3}.feedback.incorrect{background:#fff2da;border:2px solid #f9cb76}.bottom{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}.levelgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:22px 0}.level{background:#fff;border-radius:13px;padding:12px 4px;font-weight:900;border:2px solid #e0eee4}.level.done{background:#b5edc9;border-color:#6cc38a}.level.current{background:#ffe6a3;border-color:#e5b94b}.level.locked{opacity:.55}.trophy{font-size:85px}.resultbig{font-size:60px;color:#237e50;font-weight:1000;margin:10px}.review{display:grid;gap:12px;text-align:left;margin:22px auto;max-width:690px}.reviewitem{border-radius:15px;background:white;border:1px solid #dcebdc;padding:14px 18px;line-height:1.7}.reviewitem strong{color:#b95f37}.footer{text-align:center;margin-top:20px;color:#789483;font-size:13px}.instruction{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}.instruction span{padding:8px 14px;background:#fff6d9;border-radius:20px;font-weight:bold}.shake{animation:shake .3s}@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}@media(min-width:680px){.options{grid-template-columns:1fr 1fr}.levelgrid{grid-template-columns:repeat(10,minmax(0,1fr))}}@media(max-width:430px){.wrap{padding:12px 12px 40px}.hero,.card{border-radius:23px;padding:20px 16px}.choice{font-size:17px;padding:12px}.top{align-items:flex-start}.brand{font-size:17px}.pill{font-size:13px;padding:9px}.mascot{font-size:82px}.levelgrid{gap:6px}.level{padding:10px 3px}}
</style>
</head>
<body><div class="wrap"><header class="top"><div class="brand">🌿 植物探險隊 <span class="mini">自然科學・第一單元</span></div><div id="topScore" class="pill">⭐ 0 分</div></header>
<section id="home" class="hero"><div class="mascot">🌱</div><h1>植物王國大冒險</h1><p class="lead">化身小小植物探險家，挑戰 <b>20 個知識關卡</b>！<br>認識葉序、花朵、葉脈與植物的祕密。<br>答對加 5 分，答錯也能學會正確觀念！</p><div class="instruction"><span>🌟 20 個關卡</span><span>🏆 滿分 100</span><span>📱 手機也能玩</span></div><button id="start" class="btn">🚀 開始闖關</button><div id="resumeWrap" class="hidden" style="margin-top:14px"><button id="newGame" class="btn secondary">🔄 從頭重新挑戰</button></div><p class="mini">會在這台裝置上自動保存進度；每題只能作答一次。</p></section>
<section id="game" class="hidden"><div class="stats"><span id="levelLabel" class="pill">🗺️ 第 1 / 20 關</span><span id="starLabel" class="pill">⭐ 0 / 100</span></div><div class="progress" aria-label="闖關進度"><div id="progressBar" class="bar"></div></div><div class="card"><div id="category" class="tag">🌿 植物知識</div><h2 id="question" class="question"></h2><div id="options" class="options"></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div class="bottom"><button id="next" class="btn hidden">下一關 ➜</button></div></div><div id="levelGrid" class="levelgrid" aria-label="各關卡進度"></div><p class="footer">🌼 答錯沒關係，重要的是學會原因！</p></section>
<section id="end" class="hero hidden"><div class="trophy">🏆</div><h1>闖關完成！</h1><p class="lead" id="endMsg"></p><div class="resultbig" id="finalScore">0 / 100</div><p id="finalSummary" class="lead"></p><h2 style="font-size:24px">📖 錯題複習小本本</h2><div id="review" class="review"></div><button id="restart" class="btn">🌟 再挑戰一次</button></section><p class="footer">專為國小三年級自然科學複習設計｜20 題互動闖關</p></div>
<script>
const questions=[
{type:'是非題',q:'植物的葉子通常生長在莖或枝條的「節」上。',o:['○ 正確','× 錯誤'],a:0,why:'葉子通常長在莖或枝條的「節」上，節附近也可能有芽。',cat:'🍃 葉與芽'},
{type:'是非題',q:'黑板樹和軟枝黃蟬的葉序都是輪生，所以可以依照葉序把它們分成同一類。',o:['○ 正確','× 錯誤'],a:0,why:'兩者都是輪生：同一個節長出三片或更多葉子。',cat:'🌿 葉序'},
{type:'是非題',q:'只要植物的葉子形狀不同，它們的葉脈就一定不同。',o:['○ 正確','× 錯誤'],a:1,why:'葉形和葉脈是不同的觀察特徵，葉形不同不代表葉脈一定不同。',cat:'🍃 葉的觀察'},
{type:'是非題',q:'植物的花朵越香，花瓣的顏色就一定越鮮豔。',o:['○ 正確','× 錯誤'],a:1,why:'花香濃淡與花瓣顏色沒有必然關係。',cat:'🌸 花朵'},
{type:'是非題',q:'植物的根除了可以固定植物，還可以吸收水分。',o:['○ 正確','× 錯誤'],a:0,why:'根的主要功能包括固定植物，以及從土壤吸收水分和養分。',cat:'🌱 根'},
{type:'是非題',q:'所有植物的花朵都有相同數量的花瓣。',o:['○ 正確','× 錯誤'],a:1,why:'不同植物的花瓣數量可能不同，不能說「所有」花朵都相同。',cat:'🌸 花朵'},
{type:'是非題',q:'葉子在莖上排列的方式，可以分為互生、對生和輪生。',o:['○ 正確','× 錯誤'],a:0,why:'常見的葉序有互生、對生、輪生。',cat:'🌿 葉序'},
{type:'是非題',q:'植物的葉子通常可以利用陽光製造生長需要的養分。',o:['○ 正確','× 錯誤'],a:0,why:'綠色葉片通常能透過光合作用，利用陽光製造養分。',cat:'☀️ 植物生長'},
{type:'選擇題',q:'下列哪一種植物的葉序屬於「輪生」？',o:['① 青楓','② 福木','③ 黑板樹','④ 榕樹'],a:2,why:'黑板樹是輪生；青楓、福木是對生；榕樹是互生。',cat:'🌿 葉序'},
{type:'選擇題',q:'如果一株植物的葉子，每個節都長出兩片葉子，而且兩片葉子成對排列，這種葉序稱為什麼？',o:['① 互生','② 對生','③ 輪生','④ 平行脈'],a:1,why:'同一節長兩片葉子、成對排列叫「對生」。',cat:'🌿 葉序'},
{type:'選擇題',q:'下列哪一組植物的葉序相同？',o:['① 榕樹、黑板樹','② 青楓、福木','③ 榕樹、軟枝黃蟬','④ 福木、黑板樹'],a:1,why:'青楓與福木都屬於對生葉序。',cat:'🌿 葉序'},
{type:'選擇題',q:'觀察一片葉子，發現葉片上的紋路像蜘蛛網一樣互相交錯，這種葉脈稱為什麼？',o:['① 平行脈','② 網狀脈','③ 鋸齒狀葉緣','④ 輪生'],a:1,why:'像網子交錯的是網狀脈；一條條大致平行的是平行脈。',cat:'🍃 葉脈'},
{type:'選擇題',q:'下列哪一項是觀察「葉緣」的特徵？',o:['① 葉子像愛心','② 葉子是橢圓形','③ 葉子邊緣有鋸齒','④ 葉脈像蜘蛛網'],a:2,why:'葉緣是葉子的邊緣。心形與橢圓形是葉形；像蜘蛛網是葉脈。',cat:'🍃 葉緣'},
{type:'選擇題',q:'花朵的哪一個構造可以產生花粉？',o:['① 花瓣','② 花萼','③ 雄蕊','④ 雌蕊'],a:2,why:'雄蕊上的花藥可以產生花粉。',cat:'🌸 花的構造'},
{type:'選擇題',q:'下列哪一組食物，都是植物的「果實」？',o:['① 地瓜、馬鈴薯','② 柳橙、絲瓜','③ 紅豆、綠豆','④ 金針花、地瓜'],a:1,why:'柳橙和絲瓜都屬於果實；紅豆、綠豆是種子。',cat:'🍊 植物構造'},
{type:'選擇題',q:'下列關於植物生長的敘述，哪一項正確？',o:['① 所有植物都不需要陽光','② 植物的根只能固定植物，不能吸收水分','③ 植物需要適當的環境才能生長','④ 每一種植物的葉子都長得一模一樣'],a:2,why:'植物需要適量的水、空氣、光照及合適溫度等條件。',cat:'☀️ 植物生長'},
{type:'活用題',q:'某種植物的同一個節上長出了四片葉子，葉子圍繞著莖排列。這種葉序是什麼？',o:['甲：互生','乙：對生','丙：輪生'],a:2,why:'同一節長三片以上葉子，稱為輪生。',cat:'🧩 葉序活用'},
{type:'活用題',q:'小明買了馬鈴薯、地瓜、柳橙與紅豆。下列哪一個敘述正確？',o:['① 馬鈴薯和地瓜都是根','② 柳橙和紅豆都是種子','③ 馬鈴薯是莖，地瓜是根','④ 柳橙是花，紅豆是果實'],a:2,why:'馬鈴薯是塊莖、地瓜是塊根、柳橙是果實、紅豆是種子。',cat:'🥔 食物分類'},
{type:'活用題',q:'小美觀察一朵花，發現細長構造的頂端有黃色粉末。這些粉末最可能是什麼？',o:['① 種子','② 花粉','③ 果實','④ 葉綠素'],a:1,why:'花藥上常有花粉，雄蕊是產生花粉的構造。',cat:'🌸 花的構造'},
{type:'活用題',q:'A 植物的葉子是心形，B 是橢圓形，C 是針形。下列哪一項說法最正確？',o:['① 葉形不同，所以功能一定完全不同','② 葉形不同，但都可能進行光合作用','③ 只有心形葉子可以製造養分','④ 葉子的形狀可以決定花朵的顏色'],a:1,why:'葉形雖然不同，但綠色葉片通常都可以進行光合作用。',cat:'🔬 科學觀察'}
];
const KEY='plantQuest20_v1';let state={i:0,score:0,answers:[],selected:null};const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Number.isInteger(x.i)&&x.i>=0&&x.i<=20&&Array.isArray(x.answers)&&x.answers.length===x.i){state={i:x.i,score:x.answers.filter((a,j)=>a===questions[j].a).length*5,answers:x.answers,selected:null};return true}}catch(e){}return false}function page(id){['home','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo({top:0,behavior:'smooth'})}function updateTop(){$('topScore').textContent='⭐ '+state.score+' 分'}function start(reset=false){if(reset)state={i:0,score:0,answers:[],selected:null};updateTop();save();if(state.i>=20)end();else{page('game');render()}}function render(){const q=questions[state.i];$('levelLabel').textContent=`🗺️ 第 ${state.i+1} / 20 關`;$('starLabel').textContent=`⭐ ${state.score} / 100`;$('progressBar').style.width=(state.i/20*100)+'%';$('category').textContent=q.cat+'｜'+q.type;$('question').textContent=q.q;$('feedback').className='feedback hidden';$('feedback').innerHTML='';$('next').classList.add('hidden');$('options').innerHTML='';q.o.forEach((op,idx)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="symbol">${q.type==='是非題'?idx===0?'○':'×':idx+1}</span><span></span>`;b.lastChild.textContent=op;b.onclick=()=>answer(idx);$('options').append(b)});$('levelGrid').innerHTML='';questions.forEach((_,idx)=>{let d=document.createElement('div');d.className='level '+(idx<state.i?'done':idx===state.i?'current':'locked');d.textContent=idx<state.i?(state.answers[idx]===questions[idx].a?'✅':'📘'):idx===state.i?'🌟':idx+1;$('levelGrid').append(d)})}function answer(idx){if(state.selected!==null)return;state.selected=idx;const q=questions[state.i],right=idx===q.a;state.answers.push(idx);if(right)state.score+=5;updateTop();[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('good');if(j===idx&&!right)b.classList.add('bad')});let f=$('feedback');f.className='feedback '+(right?'correct':'incorrect');let strong=document.createElement('strong');strong.textContent=right?'🎉 答對了！太厲害啦！':'💡 再記住這個重點！';f.append(strong);let p=document.createElement('div');p.textContent=(right?'':'正確答案：'+q.o[q.a]+'。')+q.why;f.append(p);$('next').classList.remove('hidden');$('next').textContent=state.i===19?'🏆 看闖關成果':'下一關 ➜'}$('next').onclick=()=>{if(state.selected===null)return;state.i++;state.selected=null;save();if(state.i>=20)end();else{render();window.scrollTo({top:0,behavior:'smooth'})}};function end(){page('end');$('finalScore').textContent=state.score+' / 100';let misses=questions.map((q,i)=>({q,i,chosen:state.answers[i]})).filter(x=>x.chosen!==x.q.a);$('endMsg').textContent=state.score===100?'太厲害了！你是植物知識大師！🌟':state.score>=85?'表現很棒！植物王國為你歡呼！🌼':'每個探險家都會從錯誤中學習，繼續加油！🌱';$('finalSummary').textContent=`答對 ${20-misses.length} 題，答錯 ${misses.length} 題。`;$('review').innerHTML='';if(!misses.length){$('review').innerHTML='<div class="reviewitem">✨ 全部答對！沒有錯題需要複習！</div>'}misses.forEach(({q,i,chosen})=>{let d=document.createElement('div');d.className='reviewitem';let head=document.createElement('strong');head.textContent=`第 ${i+1} 關｜${q.cat}`;d.append(head);for(const s of [q.q,'你的答案：'+(q.o[chosen]??'未作答'),'✅ 正確答案：'+q.o[q.a],'📖 '+q.why]){let line=document.createElement('div');line.textContent=s;d.append(line)}$('review').append(d)});$('progressBar').style.width='100%'}$('start').onclick=()=>start(false);$('newGame').onclick=()=>{if(confirm('確定要清除目前闖關進度，從第一關重新開始嗎？'))start(true)};$('restart').onclick=()=>start(true);if(load()){$('start').textContent=state.i===20?'🏆 查看上次成績':`▶️ 繼續挑戰第 ${state.i+1} 關`;$('resumeWrap').classList.remove('hidden')}updateTop();
</script></body></html>
