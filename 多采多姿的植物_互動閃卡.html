<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多采多姿的植物｜互動閃卡</title><style>
:root{--g:#2f7d58;--ink:#24352b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fff6,#fff8ee);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}header{text-align:center;padding:26px 14px 22px;background:linear-gradient(120deg,#26744f,#68a86d);color:white;border-radius:0 0 28px 28px}h1{font-size:clamp(1.7rem,5vw,2.5rem);margin:0 0 8px}.wrap{max-width:900px;margin:auto;padding:18px 14px 36px}.toolbar,.controls,.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:14px 0}select,button{font:inherit;border:0;border-radius:12px;padding:11px 14px;cursor:pointer}select{background:#fff;border:1px solid #c9ddcc}button{background:var(--g);color:white;font-weight:700;box-shadow:0 3px 0 #1f5c3e}button.secondary{background:#fff;color:var(--g);border:1px solid #b8d7bf;box-shadow:none}button:disabled{opacity:.4;cursor:not-allowed}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#50715c;font-size:.95rem}.progress{height:9px;background:#e1eadf;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress div{height:100%;background:#f2b84b;width:0;transition:width .2s}.card{min-height:300px;perspective:1000px;cursor:pointer;outline:none}.inner{position:relative;min-height:300px;transition:transform .55s;transform-style:preserve-3d}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;min-height:300px;border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;border:2px solid #d4e8d4;box-shadow:0 10px 24px #234b2812}.front{background:linear-gradient(135deg,#fffdf4,#e9f8e8)}.back{background:linear-gradient(135deg,#fff8e4,#fff);transform:rotateY(180deg);border-color:#f1d88b}.eyebrow{font-weight:800;color:#6d9475;margin-bottom:14px}.face h2{font-size:clamp(1.4rem,4vw,2rem);line-height:1.5;margin:0;max-width:700px}.face p{font-size:clamp(1.05rem,3vw,1.35rem);line-height:1.85;white-space:pre-line}.hint{font-size:.9rem;color:#78917c;margin-top:20px}.actions[hidden]{display:none}.title{color:#35694a;margin:24px 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.jump{background:#fff;border:1px solid #dce9d8;color:#42654b;box-shadow:none;text-align:left}.jump.active{background:#e0f3df;border-color:#6cac79}.note{font-size:.9rem;line-height:1.8;color:#6b786d;background:#fff;border-radius:14px;padding:13px 15px;margin-top:20px}@media(max-width:560px){.wrap{padding:14px 10px 28px}.face,.card,.inner{min-height:280px}.toolbar select{max-width:100%}}
</style></head><body><header><h1>🌳 多采多姿的植物</h1><div>互動學習閃卡｜翻一翻、想一想，植物知識記得牢！</div></header><main class="wrap"><div class="toolbar"><label for="category">選擇主題：</label><select id="category"><option value="all">全部主題</option><option>植物基本構造</option><option>葉子與葉序</option><option>莖的分類</option><option>根的分類</option><option>花的構造</option><option>果實與種子</option><option>植物與生活</option></select><button class="secondary" id="shuffle">🔀 打亂順序</button><button class="secondary" id="restart">↺ 重新開始</button></div><div class="stats"><span id="counter">第 1 張 / 共 33 張</span><span id="score">答對 0 張｜再練習 0 張</span></div><div class="progress"><div id="bar"></div></div><section class="card" id="card" tabindex="0" role="button" aria-label="點擊翻轉閃卡"><div class="inner"><div class="face front"><div class="eyebrow" id="cat">🌱 植物基本構造</div><h2 id="question">植物有哪些基本構造？</h2><div class="hint">點擊卡片或按「看答案」翻面</div></div><div class="face back"><div class="eyebrow">✨ 答案揭曉</div><p id="answer">根、莖、葉、花、果實、種子。</p><div class="hint">記住了嗎？選擇下方的練習結果</div></div></div></section><div class="controls"><button class="secondary" id="prev">← 上一張</button><button id="flip">👀 看答案</button><button id="next">下一張 →</button></div><div class="actions" id="actions" hidden><button id="known">✅ 我會了</button><button class="secondary" id="retry">🔁 再練習一次</button></div><h3 class="title">📚 主題快速跳轉</h3><div class="grid" id="topics"></div><div class="note">💡 <b>小技巧：</b>先自己說出答案再翻卡。答對按「我會了」，不熟按「再練習一次」。<br>🌼 科學提醒：植物的根系、花的構造及莖的特徵會因種類而有差異；閃卡以課堂常見概念與例子為主。</div></main><noscript><div style="max-width:900px;margin:0 auto 24px;padding:12px 16px;background:#fff1b8;border-radius:12px;color:#59491b">若看不到互動效果，請用 Safari 或 Chrome 開啟此 HTML 檔案；部分檔案預覽器不會執行 JavaScript。</div></noscript><script>
const data=[
['植物基本構造','植物有哪些基本構造？','根、莖、葉、花、果實、種子。'],['植物基本構造','植物各個構造的功能都一樣嗎？','不一樣！各個構造有不同功能，幫助植物適應環境、生長與繁殖。'],
['葉子與葉序','觀察葉子時，可以觀察哪些重點？','葉形：葉子的形狀；葉緣：葉子的邊緣；葉脈：葉片上的脈絡。'],['葉子與葉序','桂花葉有哪些特徵？','葉形通常是橢圓形，葉緣有鋸齒，葉脈是網狀脈。口訣：桂花橢圓齒，葉脈像網子。'],['葉子與葉序','百合葉有哪些特徵？','葉片細長，葉緣平滑，葉脈是平行脈。口訣：百合細又長，葉脈排成行。'],['葉子與葉序','植物的「節」是什麼？','莖上長出葉子的部位稱為「節」。'],['葉子與葉序','什麼是芽？常見的芽有哪些？','芽是植物上能繼續生長的部位。常見有頂芽（枝條頂端）與側芽（枝條側面，常在葉腋附近）。'],['葉子與葉序','什麼是葉序？','葉子在莖上排列的方式稱為葉序，常見有互生、對生、輪生。'],['葉子與葉序','什麼是互生？例子有哪些？','每個節通常長出一片葉子，沿著莖交錯排列。例：榕樹。'],['葉子與葉序','什麼是對生？例子有哪些？','每個節通常長出兩片葉子，彼此相對。例：桂花。'],['葉子與葉序','什麼是輪生？例子有哪些？','每個節長出三片或三片以上的葉子。例：黑板樹。'],
['莖的分類','莖有哪些主要功能？','支撐植物的身體，也能連接根與葉等構造；莖和葉等部位會幫助植物獲取生長所需的資源。'],['莖的分類','木本莖有哪些特徵？例子有哪些？','木本植物的莖通常較堅硬、具有木質部，許多種類會長得高大。例：樟樹、木棉、小葉欖仁。'],['莖的分類','草本莖有哪些特徵？例子有哪些？','草本植物的莖通常較柔軟，許多種類可以直立生長。例：長春花、大花咸豐草。'],['莖的分類','藤本莖有哪些特徵？例子有哪些？','藤本植物的莖通常柔軟；有些無法單靠莖直立，需要攀爬或依靠其他物體生長。例：牽牛花、絲瓜。'],
['根的分類','根有哪些主要功能？','固定植物，並從土壤中吸收水分；有些植物的根也能儲存養分。'],['根的分類','什麼是軸根？例子有哪些？','有一條較明顯、較粗的主根，周圍長出許多細根。例：小白菜、菠菜等。'],['根的分類','什麼是鬚根？例子有哪些？','沒有明顯的粗大主根，有許多粗細相近、像鬍鬚一樣的根。例：蔥、蒜。'],
['花的構造','花有哪些主要構造？','花萼、花瓣、雄蕊、雌蕊。其中雄蕊和雌蕊合稱花蕊。'],['花的構造','花萼的功能是什麼？','花萼通常呈綠色、像小葉片，主要功能是保護花朵。'],['花的構造','花瓣有什麼功能？','花瓣常有明顯的顏色與形狀，可以吸引傳粉動物，幫助花粉傳播。'],['花的構造','雄蕊的構造與功能是什麼？','雄蕊的花藥會產生花粉，花粉參與植物的繁殖過程。'],['花的構造','雌蕊的構造與功能是什麼？','雌蕊通常包含柱頭、花柱和子房。授粉與受精成功後，子房通常發育成果實，胚珠發育成種子。'],
['果實與種子','果實和種子通常是怎麼形成的？','開花後，若成功完成授粉與受精，子房通常發育成果實，胚珠發育成種子。'],['果實與種子','果實有哪些特徵？','果實的外形、大小、顏色，以及種子的數量都可能不同。'],['果實與種子','果實有什麼功能？','果實可以保護種子；有些果實也能幫助種子傳播。'],['果實與種子','種子有什麼重要功能？','在適當的環境條件下，種子可以萌發，長成新的植物。'],
['植物與生活','植物在「食」方面有哪些用途？','提供食物，例如稻米、蔬菜和水果。'],['植物與生活','植物在「衣」方面有哪些用途？','植物纖維可以用來製作衣物和日常用品，例如棉製衣物、亞麻衣物。'],['植物與生活','植物在「住」方面有哪些用途？','木材可以用來製作家具或建築物，例如木屋、木製桌椅。'],['植物與生活','植物在「行」方面有哪些用途？','木材可用來製作交通工具，也可用於鋪設步道，例如拼板舟、木棧道。'],['植物與生活','植物在「育」和「樂」方面有哪些用途？','育：植物園可作為自然教育場所。樂：植物可美化環境，例如陽明山花鐘、行道樹。'],['植物與生活','植物對其他生物有什麼幫助？','植物可以提供食物、棲息地或築巢場所。例如羊吃草、鳥在樹上築巢。']];
const emoji={'植物基本構造':'🌱','葉子與葉序':'🍃','莖的分類':'🌳','根的分類':'🪴','花的構造':'🌸','果實與種子':'🍎','植物與生活':'🏡'};let deck=[...data],i=0,known=new Set(),retry=new Set();const $=x=>document.getElementById(x);function draw(){if(!deck.length)return;const [c,q,a]=deck[i];$('card').classList.remove('flipped');$('cat').textContent=(emoji[c]||'🌿')+' '+c;$('question').textContent=q;$('answer').textContent=a;$('counter').textContent=`第 ${i+1} 張 / 共 ${deck.length} 張`;$('score').textContent=`答對 ${known.size} 張｜再練習 ${retry.size} 張`;$('bar').style.width=((i+1)/deck.length*100)+'%';$('prev').disabled=i===0;$('next').disabled=i===deck.length-1;$('actions').hidden=true;$('flip').textContent='👀 看答案';document.querySelectorAll('.jump').forEach(b=>b.classList.toggle('active',b.dataset.topic===c));}function flip(){const on=$('card').classList.toggle('flipped');$('actions').hidden=!on;$('flip').textContent=on?'🙈 看問題':'👀 看答案'}function filter(cat){deck=cat==='all'?[...data]:data.filter(x=>x[0]===cat);i=0;draw()}$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>{if(i>0){i--;draw()}};$('next').onclick=()=>{if(i<deck.length-1){i++;draw()}};$('category').onchange=e=>filter(e.target.value);$('shuffle').onclick=()=>{for(let n=deck.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[deck[n],deck[j]]=[deck[j],deck[n]]}i=0;draw()};$('restart').onclick=()=>{known.clear();retry.clear();filter($('category').value)};$('known').onclick=()=>{known.add(deck[i][1]);retry.delete(deck[i][1]);if(i<deck.length-1)i++;draw()};$('retry').onclick=()=>{retry.add(deck[i][1]);known.delete(deck[i][1]);if(i<deck.length-1)i++;draw()};[['全部主題','all'],...Object.keys(emoji).map(x=>[x,x])].forEach(([label,value])=>{let b=document.createElement('button');b.className='jump';b.dataset.topic=value;b.textContent=(emoji[value]||'📖')+' '+label;b.onclick=()=>{$('category').value=value;filter(value);scrollTo({top:0,behavior:'smooth'})};$('topics').appendChild(b)});draw();
</script></body></html>
