<script>const UNITS=[[{"kind": "是非題", "q": "牽牛花的莖比較柔軟，可以攀附或纏繞其他物體向上生長。", "opts": ["○ 正確", "× 錯誤"], "ans": 0, "ex": "牽牛花屬於纏繞莖，會沿著支架向上生長。"}, {"kind": "是非題", "q": "植物的根都長在泥土裡，因此不可能在地面以上看到植物的根。", "opts": ["○ 正確", "× 錯誤"], "ans": 1, "ex": "有些植物具有露出地面的氣生根。"}, {"kind": "是非題", "q": "植物相鄰兩節的葉子錯開排列，有助於葉片獲得更多陽光。", "opts": ["○ 正確", "× 錯誤"], "ans": 0, "ex": "葉片錯開能減少互相遮蔽，增加接受光照的機會。"}, {"kind": "是非題", "q": "只要兩種植物的葉形相同，就代表它們的葉序、葉緣和葉脈也一定相同。", "opts": ["○ 正確", "× 錯誤"], "ans": 1, "ex": "葉形、葉序、葉緣、葉脈是不同的觀察特徵。"}, {"kind": "是非題", "q": "有些植物的花朵很小，或花瓣不明顯，但仍然可以開花、繁殖。", "opts": ["○ 正確", "× 錯誤"], "ans": 0, "ex": "花朵不一定大而鮮豔，不明顯的花也可以參與繁殖。"}, {"kind": "是非題", "q": "只要把任何一顆種子放在水中，不需要空氣和適當溫度，就一定會發芽。", "opts": ["○ 正確", "× 錯誤"], "ans": 1, "ex": "種子萌發通常需要水、空氣與適當溫度。"}, {"kind": "選擇題", "q": "小明在菜園裡拔起一株菠菜，發現它有一條比較粗大的主根，旁邊長出許多細根。這種根屬於哪一種？", "opts": ["鬚根", "軸根", "氣生根", "支柱根"], "ans": 1, "ex": "菠菜具有明顯的主根與側根，屬於軸根。"}, {"kind": "選擇題", "q": "下列哪一種植物的根，通常由許多粗細相近的細根組成，沒有明顯粗大的主根？", "opts": ["菠菜", "胡蘿蔔", "蔥", "白蘿蔔"], "ans": 2, "ex": "蔥的根通常是鬚根，許多細根粗細相近。"}, {"kind": "選擇題", "q": "小美觀察校園裡的兩種植物：甲植物的莖粗壯、堅硬，不容易彎曲；乙植物的莖柔軟，容易彎曲。下列哪一項正確？", "opts": ["甲是草本莖，乙是木本莖", "甲是木本莖，乙是草本莖", "兩種都是木本莖", "莖的軟硬無法作為觀察特徵"], "ans": 1, "ex": "木本莖通常較堅硬，草本莖通常較柔軟。"}, {"kind": "選擇題", "q": "牽牛花的莖會纏繞支架向上生長。這種生長方式最接近下列哪一項？", "opts": ["直立生長", "纏繞生長", "匍匐生長", "完全不需要支撐"], "ans": 1, "ex": "牽牛花的莖會纏繞其他物體向上生長。"}, {"kind": "選擇題", "q": "小華發現一片葉子的外形很像人的手掌，葉片向外伸出數個裂片。這片葉子的形狀最適合描述為什麼？", "opts": ["心形", "針形", "掌狀", "橢圓形"], "ans": 2, "ex": "有數個向外伸出的裂片、外形似手掌，可稱為掌狀。"}, {"kind": "選擇題", "q": "老師要求學生觀察葉子的「葉序」。下列哪一種觀察方式最適合？", "opts": ["觀察葉子的顏色深淺", "觀察葉子在莖或枝條上的排列方式", "觀察葉片上的紋路", "觀察葉子的邊緣是否有鋸齒"], "ans": 1, "ex": "葉序是葉子在莖或枝條上的排列方式。"}, {"kind": "選擇題", "q": "小明觀察三種植物：甲：葉緣平滑、葉脈為網狀脈；乙：葉緣有鋸齒、葉脈為網狀脈；丙：葉緣平滑、葉脈為平行脈。如果依照「葉脈種類」分類，哪兩種植物可以分在同一組？", "opts": ["甲和乙", "甲和丙", "乙和丙", "三種都不能分在同一組"], "ans": 0, "ex": "甲和乙都是網狀脈，依葉脈分類可以同組。"}, {"kind": "選擇題", "q": "同一株植物不同高度的葉子錯開排列，可能有什麼好處？", "opts": ["增加葉子接受陽光的機會", "讓植物完全不需要水", "讓植物的根停止生長", "讓葉子不再需要空氣"], "ans": 0, "ex": "錯開可減少遮蔽，增加葉片受光機會。"}, {"kind": "選擇題", "q": "一朵花還沒有開放時，花苞外面通常有一些綠色、葉片狀的構造包覆著。這些構造主要有什麼功能？", "opts": ["製造種子", "保護花苞", "吸收土壤中的水分", "運輸根部吸收的水分"], "ans": 1, "ex": "花萼常位於花朵外側，能保護花苞。"}, {"kind": "選擇題", "q": "小美觀察兩朵不同植物的花。甲花有五片花瓣，乙花有六片花瓣。下列哪一項推論最合理？", "opts": ["兩朵花的花瓣數量不同", "甲花一定比乙花香", "乙花一定比甲花大", "兩朵花的雄蕊數量一定相同"], "ans": 0, "ex": "只能由觀察確定花瓣數量不同，無法推論香味、大小或雄蕊數量。"}, {"kind": "生活應用題", "q": "老師記錄四株植物：A：心形葉、葉緣平滑；B：橢圓形葉、葉緣鋸齒狀；C：心形葉、葉緣鋸齒狀；D：針形葉、葉緣平滑。如果依「葉形」分類，哪兩株應該同一組？", "opts": ["A和B", "A和C", "B和D", "C和D"], "ans": 1, "ex": "A和C的葉形都是心形，葉緣雖不同仍可依葉形分組。"}, {"kind": "生活應用題", "q": "小明準備兩盆相同的植物，放在相同陽光與溫度下。甲盆每天澆適量水，乙盆連續很多天完全不澆水，後來乙盆開始枯萎。這個實驗最適合探討什麼？", "opts": ["水分是否會影響植物生長", "花瓣數量是否會影響植物生長", "葉子的形狀是否會改變", "不同植物的葉序是否相同"], "ans": 0, "ex": "實驗主要改變澆水條件，探討水分對植物生長的影響。"}, {"kind": "生活應用題", "q": "小華在樹下找到果實內的種子，把種子種進土壤，給予適當水分、空氣和溫度；過一段時間種子開始發芽。這最能說明什麼？", "opts": ["種子在適當條件下可以萌發成新植物", "所有果實都不能保護種子", "種子不需要水就可以發芽", "所有植物都只能用葉子繁殖"], "ans": 0, "ex": "種子在適合的環境中可能萌發成新植物。"}, {"kind": "生活應用題", "q": "小美的校園觀察：甲，有些植物的莖柔軟，會攀附其他物體生長；乙，不同植物的葉子形狀與排列方式可能不同；丙，不同植物的花朵顏色與花瓣數量可能不同。哪些正確？", "opts": ["只有甲", "只有甲和乙", "只有乙和丙", "甲、乙、丙都正確"], "ans": 3, "ex": "三項都是正確的植物觀察結果。"}], [{"kind": "是非題", "q": "物體受到力的作用後，形狀或運動狀態一定會發生改變。", "opts": ["○ 正確", "× 錯誤"], "ans": 1, "ex": "受力不代表一定能觀察到明顯的形狀或運動狀態改變。"}, {"kind": "是非題", "q": "力的三個要素是「大小、方向、作用點」。", "opts": ["○ 正確", "× 錯誤"], "ans": 0, "ex": "力的三要素為大小、方向、作用點。"}, {"kind": "是非題", "q": "不論磁鐵的形狀如何，每一塊完整的普通磁鐵都有N極和S極。", "opts": ["○ 正確", "× 錯誤"], "ans": 0, "ex": "一般完整磁鐵具有N極與S極。"}, {"kind": "是非題", "q": "長條形磁鐵的中央通常比兩端的磁力強，所以中央可以吸起最多迴紋針。", "opts": ["○ 正確", "× 錯誤"], "ans": 1, "ex": "一般長條形磁鐵兩端磁極附近通常磁力較強。"}, {"kind": "是非題", "q": "只要是金屬製作的物品，就一定可以被磁鐵吸住。", "opts": ["○ 正確", "× 錯誤"], "ans": 1, "ex": "一般磁鐵可吸引鐵等材料，但不會吸引所有金屬，例如鋁。"}, {"kind": "是非題", "q": "用力壓海綿，海綿的形狀可能改變，但是重量不會單純因為受到擠壓而改變。", "opts": ["○ 正確", "× 錯誤"], "ans": 0, "ex": "擠壓可能改變形狀，但不會單純因擠壓而改變重量。"}, {"kind": "選擇題", "q": "小明在游泳池使用浮板，浮板可以漂浮在水面上，主要與哪一種力有關？", "opts": ["磁力", "風力", "浮力", "彈力"], "ans": 2, "ex": "浮板受到水向上的浮力。"}, {"kind": "選擇題", "q": "小華從足球的右側向左推動一顆原本靜止的足球。如果沒有其他明顯阻礙，足球會往哪個方向移動？", "opts": ["向右", "向左", "向上", "向下"], "ans": 1, "ex": "向左推動原本靜止的球，球通常會向左移動。"}, {"kind": "選擇題", "q": "下列哪一項不是力的三個要素？", "opts": ["力的大小", "力的方向", "力的作用點", "物體的顏色"], "ans": 3, "ex": "顏色不是力的三要素。"}, {"kind": "選擇題", "q": "將兩塊磁鐵互相靠近，如果其中一塊的N極靠近另一塊的S極，會發生什麼現象？", "opts": ["互相排斥", "互相吸引", "磁力消失", "磁鐵變重"], "ans": 1, "ex": "異極相吸，N極與S極會互相吸引。"}, {"kind": "選擇題", "q": "下列哪一組物品最可能都被一般磁鐵吸住？", "opts": ["鐵釘、鐵製迴紋針", "鋁罐、塑膠尺", "橡皮擦、紙張", "木筷、玻璃杯"], "ans": 0, "ex": "鐵製物品通常會被一般磁鐵吸引。"}, {"kind": "選擇題", "q": "在相同測試條件下，A磁鐵吸起3支迴紋針、B吸起8支、C吸起5支、D吸起2支。哪一塊磁鐵的磁力最強？", "opts": ["A磁鐵", "B磁鐵", "C磁鐵", "D磁鐵"], "ans": 1, "ex": "在相同條件下，B吸起最多相同迴紋針。"}, {"kind": "選擇題", "q": "下列哪一項通常不會因為物體受到推、拉、壓等力量而直接改變？", "opts": ["形狀", "運動狀態", "重量", "位置"], "ans": 2, "ex": "推拉或擠壓通常不會直接改變重量。"}, {"kind": "選擇題", "q": "下列哪一項生活用品主要利用了磁鐵的特性？", "opts": ["風箏", "磁吸式門擋", "游泳圈", "橡皮筋"], "ans": 1, "ex": "磁吸式門擋利用磁力固定門。"}, {"kind": "選擇題", "q": "為什麼有些鋼鐵製造的大船可以浮在水面上？", "opts": ["因為鋼鐵不會受到重力", "因為船的形狀能排開足夠多的水，產生足夠的浮力", "因為船裡面有磁鐵", "因為鋼鐵遇到水會變輕"], "ans": 1, "ex": "船的結構能排開足夠的水，讓浮力支撐整艘船。"}, {"kind": "選擇題", "q": "下列關於磁鐵的敘述，哪一項不正確？", "opts": ["磁鐵有N極和S極", "相同磁極互相排斥", "不同磁極互相吸引", "每一塊磁鐵的磁力都一樣強"], "ans": 3, "ex": "不同磁鐵的磁力強弱可能不同。"}, {"kind": "生活應用題", "q": "小美將海綿放在桌上，用手向下壓，海綿變得比較扁。下列哪個說法最正確？", "opts": ["海綿受到力後，形狀改變", "海綿受到力後，重量一定增加", "海綿受到力後，顏色一定改變", "海綿受到力後，會變成磁鐵"], "ans": 0, "ex": "海綿受壓後可觀察到形狀改變。"}, {"kind": "生活應用題", "q": "小明把一塊磁鐵放在桌上，拿另一塊磁鐵慢慢靠近，還沒碰到時桌上的磁鐵就移動了。這證明什麼？", "opts": ["磁力一定要碰到物體才會產生作用", "磁力可以不接觸物體就產生作用", "磁鐵只會吸引物體，不會排斥", "磁鐵可以吸引所有物品"], "ans": 1, "ex": "磁力可以隔空產生吸引或排斥作用。"}, {"kind": "生活應用題", "q": "兩塊相同重量的黏土：A揉成實心圓球，B捏成中空船形。輕放入水中，哪種情況最有可能？", "opts": ["A、B一定都浮在水面", "A、B一定都沉入水底", "A可能下沉，B可能浮在水面", "B一定比A重"], "ans": 2, "ex": "形狀影響排水量與浮力，中空船形可能浮起。"}, {"kind": "生活應用題", "q": "實驗甲：用手壓扁海綿；乙：用磁鐵吸引鐵製迴紋針；丙：用手推動原本靜止的足球。下列敘述何者最正確？", "opts": ["三個實驗都一定會改變物體的重量", "只有實驗甲有力的作用", "甲可觀察到形狀改變，乙和丙可觀察到運動狀態改變", "三個實驗都只有磁力的作用"], "ans": 2, "ex": "甲呈現形狀改變；乙、丙呈現力讓物體開始移動。"}]];const KEY='nature-new40-v1';let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}let state=saved&&Array.isArray(saved.answers)&&saved.answers.length===2&&saved.answers.every(x=>Array.isArray(x)&&x.length===20)?saved:{answers:[Array(20).fill(null),Array(20).fill(null)],unit:0,idx:0};let unit=state.unit===1?1:0,idx=Math.max(0,Math.min(19,state.idx||0));let wrongOnly=false;
const $=id=>document.getElementById(id);const done=(u,i)=>state.answers[u][i]!==null;const unlocked=(u,i)=>i===0||done(u,i-1);const answered=()=>state.answers.flat().filter(x=>x!==null).length;const score=()=>UNITS.reduce((sum,arr,u)=>sum+arr.reduce((s,q,i)=>s+(state.answers[u][i]===q.ans?5:0),0),0);function save(){state.unit=unit;state.idx=idx;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function render(){save();const q=UNITS[unit][idx],choice=state.answers[unit][idx],isDone=choice!==null;$('tab0').classList.toggle('active',unit===0);$('tab1').classList.toggle('active',unit===1);$('progressLabel').textContent=`進度 ${answered()} / 40`;$('scoreLabel').textContent=`總分 ${score()} / 200`;let best=localStorage.getItem('nature-new40-best');$('bestLabel').textContent=`最佳成績 ${best??'—'}`;$('bar').style.width=(state.answers[unit].filter(x=>x!==null).length*5)+'%';$('unitStatus').textContent=`本單元已完成 ${state.answers[unit].filter(x=>x!==null).length}/20 題・本單元分數 ${UNITS[unit].reduce((v,q,i)=>v+(state.answers[unit][i]===q.ans?5:0),0)}/100`;$('kind').textContent=q.kind;$('count').textContent=`第 ${idx+1} / 20 關（全遊戲第 ${idx+1+unit*20} 關）`;$('question').textContent=q.q;
$('answers').replaceChildren();q.opts.forEach((opt,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=q.kind==='是非題'?opt:`${'①②③④'[n]} ${opt}`;if(isDone){b.disabled=true;if(n===q.ans)b.classList.add('correct');else if(n===choice)b.classList.add('wrong')}b.addEventListener('click',()=>choose(n));$('answers').appendChild(b)});$('feedback').classList.toggle('hidden',!isDone);if(isDone){$('feedback').className='feedback'+(choice===q.ans?'':' bad');$('feedback').textContent=(choice===q.ans?'🎉 答對了！':'💡 再記住這個觀念！')+' 正確答案：'+(q.kind==='是非題'?q.opts[q.ans]:'①②③④'[q.ans]+' '+q.opts[q.ans])+'。'+q.ex}
$('prev').disabled=unit===0&&idx===0;$('next').disabled=!isDone;$('next').textContent=idx===19?(unit===0?'進入第二單元 →':'查看成績 🏆'):'下一關 →';renderMap();const all=answered()===40;$('result').classList.toggle('hidden',!all);if(all){$('total').textContent=score()+' / 200 分';$('resultText').textContent=`第一單元 ${unitScore(0)}/100 分｜第二單元 ${unitScore(1)}/100 分｜答對 ${score()/5}/40 題`;const bestNum=Number(localStorage.getItem('nature-new40-best')||0);if(score()>bestNum){localStorage.setItem('nature-new40-best',String(score()));$('bestLabel').textContent=`最佳成績 ${score()}`;}renderReview()}}
function unitScore(u){return UNITS[u].reduce((v,q,i)=>v+(state.answers[u][i]===q.ans?5:0),0)}function choose(n){if(done(unit,idx)||!unlocked(unit,idx))return;state.answers[unit][idx]=n;render()}function renderMap(){$('map').replaceChildren();for(let i=0;i<20;i++){const b=document.createElement('button'),a=state.answers[unit][i],q=UNITS[unit][i];b.className='node'+(a!==null?(a===q.ans?' done':' missed'):' locked')+(i===idx?' current':'');b.textContent=i+1;b.title=a===null?'尚未作答':a===q.ans?'答對':'答錯';b.disabled=!unlocked(unit,i);b.onclick=()=>{idx=i;render()};$('map').appendChild(b)}}function renderReview(){const bad=[];UNITS.forEach((questions,u)=>questions.forEach((q,i)=>{if(state.answers[u][i]!==q.ans)bad.push({u,i,q})}));$('review').replaceChildren();if(!bad.length){$('review').textContent='🎊 40題全對！真厲害！';$('retryWrong').disabled=true;return}$('retryWrong').disabled=false;const h=document.createElement('h3');h.textContent=`📚 錯題回顧（${bad.length}題）`;$('review').appendChild(h);bad.forEach(({u,i,q})=>{const el=document.createElement('div');el.className='review';el.textContent=`${u===0?'植物':'生活中的力'} 第${i+1}題｜${q.q}｜正確：${q.opts[q.ans]}。${q.ex}`;$('review').appendChild(el)})}function goUnit(u){unit=u;idx=state.answers[u].findIndex(x=>x===null);if(idx<0)idx=0;render()}$('tab0').onclick=()=>goUnit(0);$('tab1').onclick=()=>goUnit(1);$('prev').onclick=()=>{if(idx>0)idx--;else if(unit===1){unit=0;idx=19}render()};$('next').onclick=()=>{if(!done(unit,idx))return;if(idx<19)idx++;else if(unit===0){unit=1;idx=0}else{document.getElementById('result').scrollIntoView({behavior:'smooth'})}render()};function reset(){state.answers=[Array(20).fill(null),Array(20).fill(null)];unit=idx=0;render()}$('reset').onclick=()=>{if(confirm('確定清除40題的作答紀錄並重新開始？'))reset()};$('restart').onclick=()=>{if(confirm('確定重新挑戰全部40題？'))reset()};$('retryWrong').onclick=()=>{let first=null;UNITS.forEach((arr,u)=>arr.forEach((q,i)=>{if(state.answers[u][i]!==q.ans){state.answers[u][i]=null;if(!first)first=[u,i]}}));if(first){[unit,idx]=first;render();$('quiz').scrollIntoView({behavior:'smooth'})}};render();</script></body></html>
